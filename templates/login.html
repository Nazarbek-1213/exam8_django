{% extends 'base.html' %}
{% block title %}Kirish — EzyDeal{% endblock %}

{% block extra_css %}
<style>
.login-wrap {
    min-height: calc(100vh - 68px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px; position: relative;
}

.login-glow {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(29,191,115,.08) 0%, transparent 65%);
    pointer-events: none;
}

.login-card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r3);
    padding: 44px 40px;
    position: relative;
    animation: fadeUp .6s var(--spring) both;
    box-shadow: var(--shadow-lg);
}

.login-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-dk));
    border-radius: var(--r3) var(--r3) 0 0;
}

.login-logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 32px;
}
.login-logo-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dk));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1rem; font-weight: 800;
    box-shadow: 0 4px 14px var(--accent-glow);
}
.login-logo-text {
    font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -.02em;
}
.login-logo-text em { color: var(--accent); font-style: normal; }

.login-heading {
    font-family: var(--serif);
    font-size: 1.75rem; color: var(--text);
    line-height: 1.25; margin-bottom: 8px;
}
.login-sub {
    color: var(--text2); font-size: .875rem; margin-bottom: 28px; line-height: 1.6;
}
.login-sub a { color: var(--accent); font-weight: 600; transition: opacity var(--t); }
.login-sub a:hover { opacity: .75; }

.input-icon-wrap { position: relative; }
.input-prefix-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--text3); font-size: .95rem; pointer-events: none;
    transition: color var(--t);
}
.input-icon-wrap:focus-within .input-prefix-icon { color: var(--accent); }
.input-icon-wrap .form-input { padding-left: 40px; }

.login-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dk));
    color: #fff; border: none; border-radius: 100px;
    font-family: var(--font); font-size: .9rem; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all var(--t); box-shadow: 0 4px 16px var(--accent-glow);
}
.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px var(--accent-glow);
}
.login-btn:active { transform: scale(.97); }
.login-btn svg { transition: transform var(--t); }
.login-btn:hover svg { transform: translateX(4px); }

@media (max-width: 480px) {
    .login-card { padding: 32px 24px; }
}
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-glow"></div>

    <div class="login-card">
        <div class="login-logo animate-up">
            <div class="login-logo-icon">E</div>
            <span class="login-logo-text">Ezy<em>Deal</em></span>
        </div>

        <h1 class="login-heading animate-up d1">Xush kelibsiz<br>qaytib!</h1>
        <p class="login-sub animate-up d2">
            Hali hisobingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a>
        </p>

        {% if message %}
        <div class="alert alert-error animate-up" style="margin-bottom:20px;">
            ⚠ {{ message }}
        </div>
        {% endif %}

        <form method="POST" style="display:flex;flex-direction:column;gap:16px;" class="animate-up d3">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="username">Foydalanuvchi nomi</label>
                <div class="input-icon-wrap">
                    <span class="input-prefix-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input class="form-input" type="text" name="username" id="username"
                           placeholder="username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Parol</label>
                <div class="input-icon-wrap">
                    <span class="input-prefix-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input class="form-input" type="password" name="password" id="password"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="login-btn">
                Kirish
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>
    </div>
</div>
{% endblock %}
