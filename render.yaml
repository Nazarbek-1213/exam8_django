services:
  - type: web
    name: exam8-django
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: exam8-db
          property: connectionString

databases:
  - name: exam8-db
    plan: free
    region: frankfurt
    databaseName: exam8
    user: exam8
